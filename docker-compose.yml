version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fitnxt_postgres
    environment:
      POSTGRES_DB: fitnxt_dev
      POSTGRES_USER: fitnxt
      POSTGRES_PASSWORD: fitnxt_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitnxt -d fitnxt_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fitnxt_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
